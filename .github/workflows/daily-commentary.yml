# Daily snapshot + LLM-written commentary for the dashboard's "Today's
# read" — see SPEC.md §3.6–3.8 and issue #6.
#
# Scheduled for 22:13 UTC on weekdays: after the last US session close in
# both summer (futures 21:00 UTC) and winter (22:00 UTC), off the top of
# the hour where GitHub drops runs. GitHub delays scheduled runs on free
# public repos by anything from minutes to hours (8h observed), so the
# scripts never trust the clock: the snapshot records the last *settled*
# session and dates its line by it (SPEC §3.6), and the commentary step
# skips a session that already has a note (§3.8) — so a late, weekend or
# holiday run is a cheap no-op rather than a wrong day. Appends one line
# to public/data/snapshots.jsonl, builds the stats pack, asks Claude for
# the session's note (public/data/commentary.json + commentary.jsonl), and
# pushes the commit to main.
#
# Secrets (all optional — the job degrades rather than fails without them):
#   MP_PROXY_TOKEN     lets scripts/snapshot.mjs reach Yahoo through the
#                      Cloudflare worker when Yahoo blocks the runner's IP.
#                      Must match `npx wrangler secret put MP_PROXY_TOKEN`.
#   ANTHROPIC_API_KEY  enables the commentary step. Without it the job
#                      still records the snapshot and skips the note.
#
# The push below uses GITHUB_TOKEN, and pushes made with that token never
# trigger other workflows — so the deploy is dispatched explicitly at the
# end, which IS allowed for workflow_dispatch.

name: Daily snapshot and commentary

on:
  schedule:
    - cron: "13 22 * * 1-5"
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Rewrite the note even if the session already has one"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # 22+: npm test runs the src/ TypeScript tests via Node's
          # built-in type stripping.
          node-version: "22"
          cache: "npm"

      # The Anthropic SDK is a devDependency used only by the commentary
      # step; it never enters the Vite bundle.
      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Take snapshot
        env:
          MP_PROXY_TOKEN: ${{ secrets.MP_PROXY_TOKEN }}
        run: node scripts/snapshot.mjs --history-out "$RUNNER_TEMP/history.json"

      - name: Build stats pack
        run: node scripts/stats.mjs --history "$RUNNER_TEMP/history.json" --out "$RUNNER_TEMP/stats.json"

      # continue-on-error so a failed note (API outage, refusal, bad output)
      # never costs the day's snapshot: the commit still happens, and the
      # last step re-raises the failure so the run is red and notifies.
      - name: Generate commentary
        id: commentary
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/commentary.mjs --stats "$RUNNER_TEMP/stats.json" ${{ inputs.regenerate == true && '--force' || '' }}

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --cached --quiet; then
            echo "No changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Daily snapshot and commentary $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to satusd.com
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-satusd.yml --ref main

      - name: Fail the run if the commentary step failed
        if: steps.commentary.outcome == 'failure'
        run: |
          echo "::error::Commentary generation failed — snapshot was committed, note was not. See the 'Generate commentary' step."
          exit 1
