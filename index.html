<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#ffffff" id="theme-color" />
    <!-- Resolve the theme before first paint so there's no flash. Light is
         the default; only an explicit saved "dark" switches. Same
         localStorage key as satusd.com, so the preference is shared when
         served from satusd.com/market-pulse. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme") === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          if (theme === "dark") {
            document.getElementById("theme-color").setAttribute("content", "#0b0b0b");
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <title>Market Pulse</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
